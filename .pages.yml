# Pages CMS configuration (app.pagescms.org).
# Defines what Joe can edit: blog posts and the landing page's
# sponsor/association cards. Podcast episodes are deliberately NOT exposed:
# the homepage's "The Latest" pulls from YouTube playlists at build time
# (src/lib/youtube.ts), and src/content/podcasts is unused until an episode
# archive page exists. Saves become commits to main; Netlify
# deploys them automatically.

media:
  - name: blog
    label: Blog images
    input: public/images/blog
    output: /images/blog
    extensions: [png, jpg, jpeg, webp, gif]
  - name: landing
    label: Landing page logos
    input: src/assets/landing
    output: /src/assets/landing
    extensions: [png, jpg, jpeg, svg, webp]

content:
  - name: blog
    label: Blog posts
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      fields: [title, category, pubDate, draft, featured]
      primary: title
      sort: [pubDate, title]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: "Also becomes the post's web address, so pick it carefully. It can't be changed later without help."
      - name: description
        label: Summary
        type: text
        required: true
        description: "1-2 sentences used for search results, social shares, and the RSS feed. Not shown on the homepage list."
      - name: author
        label: Author
        type: string
        default: Behind the Signs
      - name: pubDate
        label: Publish date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updatedDate
        label: Updated date
        type: date
        options:
          format: yyyy-MM-dd
        description: "Only set this when you significantly revise an already-published post."
      - name: heroImage
        label: Hero image
        type: image
        options:
          media: blog
        description: "Wide landscape image, roughly 1200x675. Optional."
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - value: business-tips
              label: Business Tips
            - value: technical-guides
              label: Technical Guides
            - value: industry-news
              label: Industry News
            - value: case-studies
              label: Case Studies
      - name: tags
        label: Tags
        type: string
        list: true
      - name: featured
        label: Featured
        type: boolean
        default: false
      - name: draft
        label: Draft (hidden from the site)
        type: boolean
        default: true
        description: "New posts start as drafts. Turn this OFF to publish."
      - name: body
        label: Body
        type: rich-text
    operations:
      rename: false

  - name: sponsors
    label: 'Landing page: Sponsors'
    type: file
    path: src/data/sponsors.json
    format: json
    fields:
      - name: sponsors
        label: Sponsors (drag to reorder; this is the homepage order)
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: logo
            label: Logo
            type: image
            required: true
            options:
              media: landing
          - name: href
            label: Website link
            type: string
            required: true
            pattern:
              regex: '^https://'
              message: "Must be a full web address starting with https://"
          - name: blurb
            label: Blurb
            type: string
            required: true

  - name: associations
    label: 'Landing page: Associations'
    type: file
    path: src/data/associations.json
    format: json
    fields:
      - name: associations
        label: Associations (drag to reorder; this is the homepage order)
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: logo
            label: Logo
            type: image
            required: true
            options:
              media: landing
          - name: href
            label: Membership link
            type: string
            required: true
            pattern:
              regex: '^https://'
              message: "Must be a full web address starting with https://"
          - name: featured
            label: Featured (full-width card)
            type: boolean
            default: false
            description: "Only ONE association should be featured at a time (currently ISA)."
