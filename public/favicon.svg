<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Flat mini version of the Behind the Signs sign: pink cabinet, neon rim, post. -->
  <style>
    .post { fill: #231f20; }
    .rim  { stroke: #231f20; }
    @media (prefers-color-scheme: dark) {
      .post { fill: #cbd5e1; }
      .rim  { stroke: #0b0b0c; }
    }
  </style>
  <rect class="post" x="29" y="40" width="6" height="24" rx="1"/>
  <g transform="rotate(-6 32 26)">
    <rect class="rim" x="5" y="7" width="54" height="38" rx="7" fill="#ed54a8" stroke-width="2.5"/>
    <rect x="11" y="13" width="42" height="26" rx="4" fill="none" stroke="#fff" stroke-width="3"/>
  </g>
</svg>
